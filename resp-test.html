<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Responsive test frames</title>
<style>
  body { background: #222; color: #fff; font-family: sans-serif; margin: 16px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  iframe { border: 2px solid #f5c518; background: #fff; display: block; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
</style>
</head>
<body>
<h1 style="font-size:18px">Oddaroa inside fixed-width frames (the site lays out as if the screen were this wide)</h1>
<div class="row">
  <div>
    <h2>PHONE — 360px wide</h2>
    <iframe src="/" width="360" height="740" title="phone"></iframe>
  </div>
  <div>
    <h2>TABLET — 768px wide</h2>
    <iframe src="/" width="768" height="900" title="tablet"></iframe>
  </div>
</div>
</body>
</html>
